<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduContinuum</title>
    <link rel="stylesheet" href="./Styles/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <section>
      <div id="container">
        <div id="landing-info">
          <div id="logo-name">
            <i class="fas fa-graduation-cap"></i>
            <h1 id="landing-heading">EduContinuum</h1>
          </div>
          <p id="landing-passage">
            Your classroom may be temporarily closed, but your learning doesn't
            have to stop. Join hundreds of students in Bamenda studying safely
            from home.
          </p>
          <div id="badges">
            <div><span>✓ </span>Free Resources</div>
            <div><span>✓ </span>Learn For Free</div>
            <div><span>✓ </span>Meet Teachers</div>
          </div>
        </div>
        <div id="starting-form">
          <form id="submit-form" action="" method="get">
            <h2>Get Started</h2>
            <div id="form-group">
              <i class="fa-solid fa-user"></i>
              <input
                type="text"
                id="student-name"
                placeholder="Full Name"
                autocomplete="name"
                required
              />
            </div>

            <div id="form-group">
              <i class="fa-solid fa-envelope"></i>
              <input
                type="email"
                id="student-email"
                placeholder="Email Address"
                autocomplete="email"
                required
              />
            </div>

            <div id="form-group">
              <i class="fa-solid fa-graduation-cap"></i>
              <select id="student-class" required>
                <option value="">Select your class</option>
                <option value="Form 1">Form 1</option>
                <option value="Form 2">Form 2</option>
                <option value="Form 3">Form 3</option>
                <option value="Form 4">Form 4</option>
                <option value="Form 5">Form 5</option>
                <option value="Lower Sixth">Lower Sixth</option>
                <option value="Upper Sixth">Upper Sixth</option>
              </select>
            </div>

            <div id="form-group">
              <i class="fa-solid fa-school"></i>
              <input
                type="text"
                id="student-school"
                placeholder="School Name"
                required
              />
            </div>

            <button type="submit" id="submit-btn">Enter <span>→</span></button>
          </form>
        </div>
      </div>
    </section>

    <script src="Scripts/script.js"></script>
  </body>
</html>

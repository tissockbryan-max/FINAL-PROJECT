<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduContinuum</title>
    <link rel="stylesheet" href="./Styles/style.css" />
  </head>
  <body>
    <section>
      <div id="container">
        <div id="landing-info" class="border">
          <h1 id="landing-heading">EduContinuum</h1>
          <p id="landing-passage">
            Your classroom may be temporarily closed, but your learning doesn't
            have to stop. Join hundreds of students in Bamenda studying safely
            from home.
          </p>
          <div id="badges">
            <div><span>✓ </span>Free Resources</div>
            <div><span>✓ </span>Learn For Free</div>
          </div>
        </div>
        <div id="starting-form" class="border">
          <form action="" method="get">
            <h2>Get Started</h2>
            <div class="form-group">
              <label for="student-name">Full Name</label>
              <input
                type="text"
                id="student-name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
              />
            </div>

            <div class="form-group">
              <label for="student-name">Email</label>
              <input
                type="email"
                id="student-email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="student-class">Class</label>
              <select id="student-class" required>
                <option value="">Select your class</option>
                <option value="Form 1">Form 1</option>
                <option value="Form 2">Form 2</option>
                <option value="Form 3">Form 3</option>
                <option value="Form 4">Form 4</option>
                <option value="Form 5">Form 5</option>
                <option value="Lower Sixth">Lower Sixth</option>
                <option value="Upper Sixth">Upper Sixth</option>
              </select>
            </div>

            <div class="form-group">
              <label for="student-school">School Name</label>
              <input
                type="text"
                id="student-school"
                placeholder="Enter your school name"
                required
              />
            </div>

            <button type="submit" id="submit-btn">Enter ↣</button>
          </form>
        </div>
      </div>
    </section>
